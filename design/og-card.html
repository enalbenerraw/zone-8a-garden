<!doctype html>
<!--
  Source for public/og-zone8a-v2.png, the social and sharing card.
  Render at 1200x630 with deviceScaleFactor 2 (2400x1260 output):
    $B viewport 1200x630 --scale 2
    $B goto file://./design/og-card.html
    $B screenshot public/og-zone8a-v2.png --selector .card
  When the card changes, bump the file name (v3, v4...) and update the default
  `image` in src/layouts/Base.astro: LinkedIn and others cache cards by URL.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=Playfair+Display:wght@400;800&display=block" rel="stylesheet">
<style>
  :root { --bg: #f7f6f0; --dark: #2c4d28; --mid: #3f6b3a; --light: #7aa06e; --rule: #d9d6c6; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); }
  .card { position: relative; width: 1200px; height: 630px; background: var(--bg); overflow: hidden; }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 16px; background: var(--dark); }
  .eyebrow { position: absolute; left: 72px; top: 66px; font: 800 22px/1 Inter, sans-serif; letter-spacing: 0.2em; color: var(--mid); }
  h1 { position: absolute; left: 70px; top: 100px; font: 800 106px/1 'Playfair Display', serif; color: var(--dark); letter-spacing: -0.01em; }
  .sub { position: absolute; left: 72px; top: 228px; font: 400 40px/1.1 'Playfair Display', serif; color: var(--dark); }
  .relay { position: absolute; left: 82px; top: 354px; display: flex; align-items: center; gap: 30px; }
  .pill { height: 56px; padding: 0 26px; border-radius: 28px; display: flex; align-items: center; font: 700 29px/1 Inter, sans-serif; color: #fff; }
  .p1 { background: var(--light); } .p2 { background: var(--mid); } .p3 { background: var(--dark); }
  .arrow { width: 30px; height: 2px; background: var(--mid); position: relative; }
  .arrow::after { content: ''; position: absolute; right: -2px; top: -6px; border-left: 10px solid var(--mid); border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
  .rule { position: absolute; left: 72px; right: 72px; top: 489px; height: 1px; background: var(--rule); }
  .domain { position: absolute; left: 72px; top: 526px; font: 700 27px/1 Inter, sans-serif; color: var(--dark); }
  .cta { position: absolute; right: 72px; top: 521px; height: 42px; padding: 0 22px; border: 2px solid var(--light); border-radius: 21px; display: flex; align-items: center; font: 700 20px/1 Inter, sans-serif; color: var(--mid); }
</style>
</head>
<body>
  <div class="card">
    <div class="bar"></div>
    <div class="eyebrow">USDA ZONE 8A GARDEN GUIDE</div>
    <h1>Every bed, all year</h1>
    <div class="sub">Multiple raised beds, each a relay: three crops a year.</div>
    <div class="relay">
      <div class="pill p1">Spring spinach</div><div class="arrow"></div>
      <div class="pill p2">Summer beans</div><div class="arrow"></div>
      <div class="pill p3">Fall + winter brassicas</div>
    </div>
    <div class="rule"></div>
    <div class="domain">zone8a.com</div>
    <div class="cta">Find your zone</div>
  </div>
</body>
</html>
